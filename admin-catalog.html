<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Kelola Katalog — Admin WGA Dekorasi</title>
    <link rel="icon" href="assets/wga-mark-32.png" />
    <link rel="prefetch" href="admin-moments.html" />
    <link rel="stylesheet" href="css/style.css?v=20261011" />
    <link rel="stylesheet" href="css/reviews.css?v=20261011" />
    <script src="js/review-shared.js?v=20261011" defer></script>
    <script src="js/admin-auth.js?v=20261011" defer></script>
    <script src="js/admin-media.js?v=1" defer></script>
    <script src="js/auto-pager.js?v=1" defer></script>
    <script src="js/admin-gallery.js?v=3" defer></script>
    <script src="js/admin-catalog.js?v=4" defer></script>
  </head>
  <body class="review-page admin-page">
    <header class="review-header">
      <div class="container review-nav">
        <a class="brand" href="index.html">
          <img src="assets/wga-mark-64.png" width="45" height="45" alt="" />
          <span class="title admin-brand-title">WGA <span class="brand-name-accent">Dekorasi</span> <span class="admin-label">Admin</span></span>
        </a>
        <nav class="admin-nav-links" aria-label="Navigasi admin">
          <a aria-current="page" href="admin-catalog.html">Kelola katalog</a>
          <a href="admin-moments.html">Upload momen</a>
          <a href="admin-reviews.html">Kelola ulasan</a>
        </nav>
        <div class="admin-nav-actions">
          <button id="logout" class="btn ghost admin-logout" type="button">Log out</button>
        </div>
      </div>
    </header>
    <main class="container review-main">
      <section class="admin-page-heading" aria-labelledby="catalog-page-title">
        <p class="eyebrow">Koleksi persewaan</p>
        <h1 id="catalog-page-title">Kelola katalog</h1>
        <p class="form-intro">Tambahkan item katalog baru, pilih kategori, dan hapus item yang sudah tidak tersedia.</p>
        <p id="admin-page-status" class="form-message" role="status"></p>
      </section>
      <section id="catalog-panel" class="moment-admin-panel" aria-labelledby="catalog-title">
        <div class="panel-kicker">Tambah item</div>
        <h2 id="catalog-title">Item katalog baru</h2>
        <form id="catalog-form">
          <label>Foto katalog<input id="catalog-file" type="file" accept="image/jpeg,image/png,image/webp" required /></label>
          <label>Nama item<input id="catalog-title-input" maxlength="120" placeholder="Contoh: Tenda VIP / Kain" required /></label>
          <label>Kategori<select id="catalog-category" required></select></label>
          <label id="catalog-custom-category-wrap" hidden>Kategori baru<input id="catalog-custom-category" maxlength="60" placeholder="Contoh: Dekorasi Tradisional" /></label>
          <div id="catalog-upload-status" class="form-message" role="status"></div>
          <button id="catalog-upload-button" class="btn primary" type="submit">Upload item katalog</button>
        </form>
        <div class="moment-admin-heading"><h3>Item katalog tersimpan</h3><button id="refresh-catalog" class="btn ghost" type="button">Muat ulang</button></div>
        <div id="catalog-admin-list" class="moment-admin-list"></div>
      </section>
    </main>
  </body>
</html>
